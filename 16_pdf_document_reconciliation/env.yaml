name: myenv
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pytorch
  - transformers
  - huggingface_hub          # core Hugging Face library
  - langchain
  - langgraph
  - matplotlib
  - seaborn
  - flask
  - flask-cors               # corresponds to the "flaskcors" request
  - sentence-transformers

  - pip:
      - easyocr             # OCR engine (image → text)
      - fpdf2