<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Document Reconciliation</title>

    <!-- React + Babel standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --text: #2d3436;
            --text-secondary: #636e72;
            --border: #dfe6e9;
            --accent: #0984e3;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .app-header {
            background: linear-gradient(135deg, #2d3436 0%, #434a54 100%);
            color: #fff;
            padding: 24px 32px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }
        .app-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .app-header p {
            font-size: 0.9rem;
            opacity: 0.75;
            margin-top: 4px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        /* ── Tabs ─────────────────────────────────── */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 28px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 4px;
            box-shadow: var(--shadow);
        }
        .tab {
            flex: 1;
            padding: 12px 20px;
            text-align: center;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
            color: var(--text-secondary);
            border: none;
            background: transparent;
        }
        .tab:hover { color: var(--text); }
        .tab.active {
            background: var(--accent);
            color: #fff;
        }

        /* ── Download PDF button ─────────────────── */
        .download-btn {
            flex: 0 0 auto;
            padding: 12px 24px;
            text-align: center;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
            color: #fff;
            border: none;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            white-space: nowrap;
            margin-left: 8px;
        }
        .download-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* ── Download Excel button ──────────────── */
        .excel-btn {
            flex: 0 0 auto;
            padding: 12px 24px;
            text-align: center;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
            color: #fff;
            border: none;
            background: linear-gradient(135deg, #27ae60, #1e8449);
            white-space: nowrap;
            margin-left: 8px;
        }
        .excel-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* ── Document List ────────────────────────── */
        .doc-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .doc-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: box-shadow 0.2s;
        }
        .doc-card:hover { box-shadow: 0 4px 24px rgba(0,0,0,0.10); }

        .doc-card-header {
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .doc-card-header:hover { background: #fafbfc; }
        .doc-card.expanded .doc-card-header {
            border-bottom-color: var(--border);
        }
        .doc-icon {
            width: 40px; height: 40px;
            border-radius: 8px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 1.1rem; flex-shrink: 0;
        }
        .doc-name {
            flex: 1;
            font-weight: 600;
            font-size: 0.95rem;
            word-break: break-word;
        }
        .doc-chevron {
            font-size: 1.2rem;
            color: var(--text-secondary);
            transition: transform 0.25s;
        }
        .doc-card.expanded .doc-chevron { transform: rotate(180deg); }

        .doc-matches {
            display: none;
            padding: 0 20px 16px;
        }
        .doc-card.expanded .doc-matches { display: block; }

        .match-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f2f5;
        }
        .match-row:last-child { border-bottom: none; }
        .match-rank {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: 700; color: var(--text-secondary);
            flex-shrink: 0;
        }
        .match-name {
            flex: 1;
            font-size: 0.88rem;
            word-break: break-word;
        }
        .match-score {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--accent);
            flex-shrink: 0;
            min-width: 60px; text-align: right;
        }
        .score-bar {
            width: 80px; height: 6px;
            border-radius: 3px;
            background: #eee;
            flex-shrink: 0;
            overflow: hidden;
        }
        .score-bar-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #00b894, #0984e3);
            transition: width 0.3s;
        }

        /* ── Heatmap ──────────────────────────────── */
        .heatmap-section {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 24px;
            overflow-x: auto;
        }
        .heatmap-section h3 {
            margin-bottom: 16px;
            font-size: 1.1rem;
        }
        .heatmap-table {
            border-collapse: collapse;
            font-size: 0.78rem;
        }
        .heatmap-table th, .heatmap-table td {
            padding: 3px;
            text-align: center;
        }
        .heatmap-table th:first-child, .heatmap-table td:first-child {
            text-align: left;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
            padding-right: 8px;
        }
        .heatmap-table thead th {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
            font-size: 0.7rem;
            color: var(--text-secondary);
            padding: 6px 3px;
            vertical-align: bottom;
        }
        .heatmap-cell {
            width: 42px; height: 42px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.7rem;
            color: #333;
            cursor: default;
        }
        .heatmap-cell:hover {
            outline: 2px solid #333;
            outline-offset: -1px;
            z-index: 1;
        }

        /* ── Loading / Empty ──────────────────────── */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-banner {
            background: #ffeaa7;
            color: #636e72;
            padding: 14px 20px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ── Color scale: YlOrRd ────────────────────────────────────────
        // Colors from ColorBrewer YlOrRd 9-class
        const YLORRD = [
            "#ffffcc", "#ffeda0", "#fed976", "#feb24c",
            "#fd8d3c", "#fc4e2a", "#e31a1c", "#bd0026", "#800026"
        ];

        function getHeatColor(score) {
            // Map [0.5, 1.0] → index [0, 8]  (clamp low end for visibility)
            const idx = Math.min(8, Math.max(0, Math.floor((score - 0.5) / 0.5 * 9)));
            return YLORRD[Math.min(8, Math.max(0, idx))];
        }

        function getTextColor(score) {
            return score > 0.85 ? "#fff" : "#333";
        }

        // ── Shorten filename for display ──────────────────────────────
        function shortName(name) {
            const noExt = name.replace(/\.pdf$/i, "");
            if (noExt.length <= 35) return noExt;
            return noExt.substring(0, 32) + "...";
        }

        // ── App ───────────────────────────────────────────────────────
        function App() {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [activeTab, setActiveTab] = useState("list"); // "list" | "heatmap"
            const [expandedDoc, setExpandedDoc] = useState(null);

            useEffect(() => {
                fetch("http://localhost:5000/api/similarity")
                    .then(r => {
                        if (!r.ok) throw new Error(`HTTP ${r.status}`);
                        return r.json();
                    })
                    .then(setData)
                    .catch(e => setError(e.message))
                    .finally(() => setLoading(false));
            }, []);

            // ── Render ────────────────────────────────────────────────
            if (loading) {
                return (
                    <div>
                        <header className="app-header">
                            <h1>📄 PDF Document Reconciliation</h1>
                            <p>Semantic similarity analysis using BAAI/bge-m3 embeddings</p>
                        </header>
                        <div className="container">
                            <div className="loading">
                                <div className="spinner"></div>
                                <p>Loading similarity data…</p>
                            </div>
                        </div>
                    </div>
                );
            }

            if (error) {
                return (
                    <div>
                        <header className="app-header">
                            <h1>📄 PDF Document Reconciliation</h1>
                        </header>
                        <div className="container">
                            <div className="error-banner">
                                ⚠ Failed to load data: {error}. Make sure the Flask backend is running on port 5000.
                            </div>
                        </div>
                    </div>
                );
            }

            const { doc_names, matrix, top_matches } = data;

            return (
                <div>
                    <header className="app-header">
                        <h1>📄 PDF Document Reconciliation</h1>
                        <p>{doc_names.length} documents · Semantic similarity via BAAI/bge-m3</p>
                    </header>

                    <div className="container">
                        {/* Tabs */}
                        <div className="tabs">
                            <button
                                className={`tab ${activeTab === "list" ? "active" : ""}`}
                                onClick={() => setActiveTab("list")}
                            >
                                📋 Document Matches
                            </button>
                            <button
                                className={`tab ${activeTab === "heatmap" ? "active" : ""}`}
                                onClick={() => setActiveTab("heatmap")}
                            >
                                🔥 Similarity Heatmap
                            </button>
                            <button
                                className="download-btn"
                                onClick={() => window.open("http://localhost:5000/api/report/pdf", "_blank")}
                            >
                                ⬇ Download PDF
                            </button>
                            <button
                                className="excel-btn"
                                onClick={() => window.open("http://localhost:5000/api/report/excel", "_blank")}
                            >
                                ⬇ Download Excel
                            </button>
                        </div>

                        {activeTab === "list" ? (
                            <DocumentList
                                docNames={doc_names}
                                topMatches={top_matches}
                                expandedDoc={expandedDoc}
                                setExpandedDoc={setExpandedDoc}
                            />
                        ) : (
                            <HeatmapView docNames={doc_names} matrix={matrix} />
                        )}
                    </div>
                </div>
            );
        }

        // ── Document List View ────────────────────────────────────────
        function DocumentList({ docNames, topMatches, expandedDoc, setExpandedDoc }) {
            return (
                <div className="doc-list">
                    {docNames.map((name, idx) => {
                        const isExpanded = expandedDoc === name;
                        const matches = topMatches[name] || [];

                        return (
                            <div key={name} className={`doc-card ${isExpanded ? "expanded" : ""}`}>
                                <div
                                    className="doc-card-header"
                                    onClick={() => setExpandedDoc(isExpanded ? null : name)}
                                >
                                    <div className="doc-icon">📄</div>
                                    <div className="doc-name">
                                        <div>{shortName(name)}</div>
                                        <div style={{fontSize:"0.75rem", color:"var(--text-secondary)", marginTop:2}}>
                                            Top match: {matches.length > 0 ? `${(matches[0].score*100).toFixed(1)}% similar to "${shortName(matches[0].document)}"` : "N/A"}
                                        </div>
                                    </div>
                                    <span className="doc-chevron">▾</span>
                                </div>

                                {isExpanded && (
                                    <div className="doc-matches">
                                        {matches.map((m, mi) => (
                                            <div key={m.document} className="match-row">
                                                <div className="match-rank">{mi + 1}</div>
                                                <div className="match-name" title={m.document}>
                                                    {shortName(m.document)}
                                                </div>
                                                <div className="score-bar">
                                                    <div
                                                        className="score-bar-fill"
                                                        style={{ width: `${Math.round(m.score * 100)}%` }}
                                                    />
                                                </div>
                                                <div className="match-score">
                                                    {(m.score * 100).toFixed(1)}%
                                                </div>
                                            </div>
                                        ))}
                                        {matches.length === 0 && (
                                            <div style={{color:"var(--text-secondary)", fontSize:"0.85rem", padding:"8px 0"}}>
                                                No other documents to compare.
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        }

        // ── Heatmap View ──────────────────────────────────────────────
        function HeatmapView({ docNames, matrix }) {
            const n = docNames.length;

            return (
                <div className="heatmap-section">
                    <h3>🔬 Pairwise Cosine Similarity Heatmap (YlOrRd)</h3>
                    <p style={{fontSize:"0.82rem", color:"var(--text-secondary)", marginBottom:16}}>
                        Diagonal = 1.00 (self-match). Hover cells for exact values.
                    </p>
                    <div style={{ overflowX: "auto" }}>
                        <table className="heatmap-table">
                            <thead>
                                <tr>
                                    <th></th>
                                    {docNames.map(name => (
                                        <th key={name} title={name}>{shortName(name)}</th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody>
                                {docNames.map((rowName, i) => (
                                    <tr key={rowName}>
                                        <td title={rowName}>{shortName(rowName)}</td>
                                        {docNames.map((colName, j) => {
                                            const score = matrix[i][j];
                                            return (
                                                <td key={colName}>
                                                    <div
                                                        className="heatmap-cell"
                                                        style={{
                                                            background: getHeatColor(score),
                                                            color: getTextColor(score),
                                                            display: "flex",
                                                            alignItems: "center",
                                                            justifyContent: "center",
                                                        }}
                                                        title={`${shortName(rowName)} ↔ ${shortName(colName)}: ${(score*100).toFixed(1)}%`}
                                                    >
                                                        {(score * 100).toFixed(0)}
                                                    </div>
                                                </td>
                                            );
                                        })}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // ── Mount ─────────────────────────────────────────────────────
        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
